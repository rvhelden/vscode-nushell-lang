<!doctype html>
<html>
  <head>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline' {{cspSource}}; script-src 'nonce-{{nonce}}' {{cspSource}};"
    />
    <link rel="stylesheet" href="{{css}}" />
    <style>
      /* toolbar */
      #toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 4px 8px;
        border-bottom: 1px solid var(--border);
        font-family: var(--vscode-font-family, sans-serif);
      }
      #toolbar label {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      #toolbar label.tokens {
        color: var(--token);
      }
      #toolbar label.values {
        color: var(--value);
      }
      #error {
        color: var(--vscode-errorForeground, #f48771);
        cursor: pointer;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #status {
        padding: 1em;
      }

      /* tree | splitter | side */
      #main {
        --split: 60%;
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: var(--split) 4px 1fr;
      }
      #tree {
        overflow: auto;
        outline: none;
      }
      #splitter {
        cursor: col-resize;
        background: var(--border);
      }
      #splitter:hover {
        background: var(--vscode-sash-hoverBorder, #007fd4);
      }
      @media (max-width: 640px) {
        #main {
          grid-template-columns: 1fr;
          grid-template-rows: 3fr 2fr;
        }
        #splitter {
          display: none;
        }
        #side {
          border-top: 1px solid var(--border);
        }
      }

      #main.below {
        grid-template-columns: 1fr;
        grid-template-rows: var(--split) 4px 1fr;
      }
      #main.below #splitter {
        display: block;
        cursor: row-resize;
      }
      #main.below #side {
        border-top: none;
      }
      /* the graph is in its own window */
      #main.detached {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr;
      }
      #main.detached #splitter,
      #main.detached #side {
        display: none;
      }

      /* tree table */
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th {
        position: sticky;
        top: 0;
        text-align: left;
        font-weight: normal;
        padding: 2px 8px;
        background: var(--vscode-editor-background);
        border-bottom: 1px solid var(--border);
        color: var(--vscode-descriptionForeground, #999);
        font-family: var(--vscode-font-family, sans-serif);
      }
      td {
        padding: 1px 8px;
        white-space: nowrap;
      }
      tr:hover td {
        background: var(--vscode-list-hoverBackground, #2a2d2e);
      }
      tr.selected td {
        background: var(--vscode-list-inactiveSelectionBackground, #37373d);
      }
      #tree:focus tr.selected td {
        background: var(--vscode-list-activeSelectionBackground, #04395e);
        color: var(--vscode-list-activeSelectionForeground, inherit);
      }
      td.text {
        max-width: 40ch;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .twisty {
        display: inline-block;
        width: 1.2em;
        cursor: pointer;
        color: var(--vscode-foreground);
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <label class="tokens"
        ><input type="checkbox" id="show-tokens" /> Tokens</label
      >
      <label class="values"
        ><input type="checkbox" id="show-values" /> Values</label
      >
      <span>
        <button id="expand-all" title="Expand all">⊞</button>
        <button id="collapse-all" title="Collapse all">⊟</button>
      </span>
      <span>
        <button id="layout"></button>
        <button id="detach" title="Open the graph in its own window">⧉</button>
      </span>
      <span id="error" title="Select the error in the editor" hidden></span>
    </div>
    <div id="status" class="dim">Parsing…</div>
    <div id="main" hidden>
      <div id="tree" tabindex="0">
        <table>
          <thead>
            <tr>
              <th>Kind</th>
              <th>Property</th>
              <th>Type</th>
              <th>Span</th>
              <th>Text</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div id="splitter"></div>
      <div id="side"></div>
    </div>
    <script nonce="{{nonce}}" src="{{script}}"></script>
  </body>
</html>
